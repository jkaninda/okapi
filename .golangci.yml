version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: comment-spacings
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupl
          - lll
        path: /*
    # Test files are analysed but not reported on: table-driven tests repeat
    # literals by nature, which goconst flags with nothing to fix. They stay
    # analysed so `unused` still sees helpers that only tests call.
    paths:
      - _test\.go$
      - third_party$
      - builtin$
      - ^examples/
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - ^examples/