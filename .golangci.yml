version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    goconst:
      # Test data is clearer written out at each use than hidden behind a name,
      # and table-driven cases repeat literals by nature.
      ignore-tests: true
    revive:
      rules:
        - name: comment-spacings
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupl
          - lll
        path: /*
    paths:
      - third_party$
      - builtin$
      # Anchored so it matches files under examples/, not a dir literally named
      # "examples" at the end of a path.
      - ^examples/
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      # Anchored so it matches files under examples/, not a dir literally named
      # "examples" at the end of a path.
      - ^examples/
